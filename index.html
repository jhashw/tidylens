document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );

    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"d88c9230-18de-4702-af58-055ad3143084\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* Classical — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */\n/* Fonts vendored locally — no external requests. */\n@font-face {\n  font-family: 'Cormorant Garamond';\n  src: url(\"c7e98092-8bd6-4da1-9dbd-90eda1b906b2\") format('woff2');\n  font-weight: 300 700;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Lora';\n  src: url(\"4b512005-bd65-4e96-bf83-b8ca81df0d11\") format('woff2');\n  font-weight: 400 700;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201f1d;\n  --color-accent: #b68235;\n  --color-accent-2: #ac803e;\n  --color-divider: color-mix(in srgb, #201f1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff3e4;\n  --color-accent-200: #ffe3bf;\n  --color-accent-300: #facb8d;\n  --color-accent-400: #e1ad66;\n  --color-accent-500: #c28d41;\n  --color-accent-600: #a06f24;\n  --color-accent-700: #7d5411;\n  --color-accent-800: #5a3b0a;\n  --color-accent-900: #3a270d;\n\n  --color-accent-2-100: #fff3e4;\n  --color-accent-2-200: #ffe3be;\n  --color-accent-2-300: #f5cd96;\n  --color-accent-2-400: #dbaf70;\n  --color-accent-2-500: #bc8f4e;\n  --color-accent-2-600: #9b7232;\n  --color-accent-2-700: #79561f;\n  --color-accent-2-800: #573d14;\n  --color-accent-2-900: #382810;\n\n  --font-heading: \"Cormorant Garamond\", system-ui, sans-serif;\n  --font-heading-weight: 600; /* review round 3: bold retired — semibold is the\n     interface headings' ceiling (they need the weight at small sizes); display\n     text goes lighter still, to the normal cut (see the deck) */\n  --font-body: \"Lora\", system-ui, sans-serif;\n\n  --space-1: 4.6px;\n  --space-2: 9.2px;\n  --space-3: 13.8px;\n  --space-4: 18.4px;\n  --space-6: 27.6px;\n  --space-8: 36.8px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.plate{filter:sepia(0.22) saturate(0.82) contrast(1.05);box-sizing:border-box;\n  border:6px solid var(--color-surface);outline:1px solid var(--color-divider)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: transparent;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt -heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg); border: 1px solid var(--color-divider);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"0b0fe2c3-82a7-47f4-8cff-4f838835abef\"><\u002Fscript>\n<script src=\"1b233e48-23c8-40fa-8516-26b3b00bf1cb\"><\u002Fscript>\n<style>\n  html, body { height: 100%; }\n  body { margin: 0; }\n  :root { --sig-ok: #5d7a58; --sig-bad: #a0554a; }\n  :root[data-theme=\"dark\"] {\n    --sig-ok: #93b08c;\n    --sig-bad: #d4897b;\n    --color-bg: #191817;\n    --color-surface: #242220;\n    --color-text: #ece6dc;\n    --color-divider: color-mix(in srgb, #ece6dc 20%, transparent);\n    --color-accent: #d3a35d;\n    --color-accent-100: #3a270d;\n    --color-accent-200: #5a3b0a;\n    --color-accent-700: #f3cd94;\n    --color-accent-800: #ffe3bf;\n    --color-accent-2-100: #382810;\n    --color-accent-2-800: #ffe3be;\n    --color-neutral-100: #2d2b2b;\n    --color-neutral-800: #eae7e7;\n    --shadow-sm: 0 1px 2px rgba(0,0,0,.45);\n    --shadow-md: 0 4px 14px rgba(0,0,0,.5);\n    --shadow-lg: 0 14px 40px rgba(0,0,0,.55);\n  }\n  ::-webkit-scrollbar { width: 10px; height: 10px; }\n  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--color-text) 22%, transparent); border-radius: 6px; }\n  ::-webkit-scrollbar-track { background: transparent; }\n  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-feature-settings:'tnum' 0\">\n\n  <header class=\"nav\" style=\"position:sticky;top:0;z-index:20;background:var(--color-bg);gap:var(--space-6)\">\n    <div class=\"nav-brand\" style=\"margin-right:0;font-size:25px;letter-spacing:-.005em;color:var(--color-accent-700)\">TidyLens<\u002Fdiv>\n    <div style=\"font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:color-mix(in srgb,var(--color-accent-700) 78%,transparent);margin-right:auto\">Cleaning &amp; exploration<\u002Fdiv>\n    <nav style=\"display:flex;align-items:center;gap:var(--space-4)\">\n      <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"{{ s.style }}\" style-hover=\"color:var(--color-accent)\">\n          <span style=\"font-feature-settings:'tnum';opacity:.55\">{{ s.n }}<\u002Fspan>\n          <span>{{ s.label }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ toggleDark }}\" style=\"padding:6px 12px;gap:8px\">\n      <span style=\"font-size:13px\">{{ themeLabel }}<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ hasSaveFile }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:var(--space-6);background:color-mix(in srgb,var(--color-neutral-900) 55%,transparent)\">\n      <div style=\"width:min(520px,100%);border:1px solid var(--color-divider);border-radius:var(--radius-md);background:var(--color-bg);box-shadow:var(--shadow-lg);padding:var(--space-6)\">\n        <div style=\"font-family:var(--font-heading);font-size:26px;margin-bottom:var(--space-2)\">{{ saveTitle }}<\u002Fdiv>\n        <p style=\"margin:0 0 var(--space-3);font-size:14.5px;line-height:1.6;color:color-mix(in srgb,var(--color-text) 76%,transparent)\">{{ saveBlurb }}<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center\">\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ copySave }}\" style=\"font-size:15px;padding:9px 18px\">{{ copyLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ saveCanDownload }}\" hint-placeholder-val=\"{{ false }}\">\n            <a class=\"btn btn-secondary\" href=\"{{ saveHref }}\" download=\"{{ saveName }}\" style=\"font-size:15px;padding:9px 18px;text-decoration:none\">Try the download again<\u002Fa>\n          <\u002Fsc-if>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ dismissSave }}\" style=\"font-size:15px;margin-left:auto\">Close<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-top:var(--space-2);font-size:13.5px;color:var(--color-accent-700)\">{{ saveHint }}<\u002Fdiv>\n        <textarea id=\"tl-save-text\" sc-camel-read-only=\"{{ true }}\" sc-camel-on-click=\"{{ selectSave }}\" value=\"{{ saveText }}\" style=\"margin-top:var(--space-3);width:100%;height:118px;resize:vertical;padding:9px 10px;border:1px solid var(--color-divider);border-radius:var(--radius-sm);background:var(--color-surface);color:var(--color-text);font-family:var(--font-body);font-size:12px;font-feature-settings:'tnum';white-space:pre;overflow:auto\"><\u002Ftextarea>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isDrop }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"max-width:940px;margin:0 auto;padding:var(--space-8) var(--space-6);display:flex;flex-direction:column;gap:var(--space-6)\">\n      <div style=\"display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-3)\">\n        <h1 style=\"font-weight:400;font-size:68px;line-height:1.04;margin:0;letter-spacing:-.015em\">Clean it up,<br>then have a look.<\u002Fh1>\n        <p style=\"margin:0;font-size:20px;line-height:1.5;max-width:46ch;color:color-mix(in srgb,var(--color-text) 76%,transparent)\">Drop in a spreadsheet and I’ll tidy it column by column, then show you what’s actually in there.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:var(--space-3)\">\n        <div sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drag-leave=\"{{ onDragLeave }}\" sc-camel-on-drop=\"{{ onDrop }}\" sc-camel-on-click=\"{{ openFile }}\" style=\"{{ dropStyle }}\">\n          <div style=\"font-family:var(--font-heading);font-size:30px\">Drop a file here<\u002Fdiv>\n          <div style=\"font-size:15px;color:color-mix(in srgb,var(--color-text) 58%,transparent);margin-top:2px\">CSV, TSV or Excel<\u002Fdiv>\n          <div style=\"margin-top:var(--space-4)\"><span class=\"btn btn-primary\" style=\"font-size:15px;padding:9px 20px\">Open a file…<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ loadExample }}\" style=\"font-size:14.5px\">Or try the example — 1,898 food orders<\u002Fbutton>\n        <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:1px solid var(--color-accent);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);font-size:14px;color:var(--color-accent-700)\">{{ error }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <input type=\"file\" accept=\".csv,.tsv,.txt,.xlsx,.xls\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onFileInput }}\" style=\"display:none\">\n      <\u002Fdiv>\n\n      <hr class=\"hr\" style=\"margin:var(--space-2) 0 0\">\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:var(--space-8)\">\n        <div style=\"display:flex;flex-direction:column;gap:var(--space-3)\">\n          <div style=\"display:flex;align-items:center;gap:11px\">\n            <span style=\"width:11px;height:11px;flex:none;border-radius:2px;background:color-mix(in srgb,#b68235 30%,transparent);border:1px solid #b68235\"><\u002Fspan>\n            <h3 style=\"margin:0;font-weight:400;font-size:32px\">Clean<\u002Fh3>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:auto 1fr;gap:11px 11px;font-size:15px;line-height:1.45\">\n            <span style=\"color:#b68235\">—<\u002Fspan><span>Set the datatype of every column<\u002Fspan>\n            <span style=\"color:#b68235\">—<\u002Fspan><span>Allow or deny particular values, and say what happens when one slips through<\u002Fspan>\n            <span style=\"color:#b68235\">—<\u002Fspan><span>Choose how dates are read and how they get written back<\u002Fspan>\n            <span style=\"color:#b68235\">—<\u002Fspan><span>Trim stray spaces, mend odd characters, settle on one letter case<\u002Fspan>\n            <span style=\"color:#b68235\">—<\u002Fspan><span>Get everything questionable flagged — blanks, duplicates, mixed spellings — and answer each one<\u002Fspan>\n            <span style=\"color:#b68235\">—<\u002Fspan><span>Export the tidy table as CSV<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:var(--space-3)\">\n          <div style=\"display:flex;align-items:center;gap:11px\">\n            <span style=\"width:11px;height:11px;flex:none;border-radius:2px;background:color-mix(in srgb,#6c8464 30%,transparent);border:1px solid #6c8464\"><\u002Fspan>\n            <h3 style=\"margin:0;font-weight:400;font-size:32px\">Explore<\u002Fh3>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:auto 1fr;gap:11px 11px;font-size:15px;line-height:1.45\">\n            <span style=\"color:#6c8464\">—<\u002Fspan><span>Mean, median, spread and quartiles for every number<\u002Fspan>\n            <span style=\"color:#6c8464\">—<\u002Fspan><span>Histograms and category bars, with the bin width in your hands<\u002Fspan>\n            <span style=\"color:#6c8464\">—<\u002Fspan><span>Plot any column against any other and hover any point<\u002Fspan>\n            <span style=\"color:#6c8464\">—<\u002Fspan><span>Fit a trendline and read its equation, r and R² in plain words<\u002Fspan>\n            <span style=\"color:#6c8464\">—<\u002Fspan><span>A correlation matrix, plus the outliers worth a second look<\u002Fspan>\n            <span style=\"color:#6c8464\">—<\u002Fspan><span>Filter once — every plot follows<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isRaw }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"max-width:1240px;margin:0 auto;padding:var(--space-6) var(--space-6) var(--space-8);display:flex;flex-direction:column;gap:var(--space-4)\">\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap\">\n        <div>\n          <div class=\"card-kicker\">{{ fileName }} — as read, nothing altered<\u002Fdiv>\n          <h2 style=\"margin:0;font-weight:400;font-size:36px\">{{ rawShape }}<\u002Fh2>\n          <p style=\"margin:var(--space-2) 0 0;font-size:15px;max-width:64ch;color:color-mix(in srgb,var(--color-text) 72%,transparent)\">{{ rawBlurb }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:var(--space-2);align-items:center\">\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ gotoDrop }}\">New file<\u002Fbutton>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ gotoClean }}\">Continue to schema →<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-md)\">\n        <div style=\"display:flex;align-items:baseline;justify-content:space-between;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-divider)\">\n          <h6 style=\"margin:0\">Preview — raw<\u002Fh6>\n          <span style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ rawNote }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"overflow:auto;max-height:62vh\">\n          <sc-raw-table class=\"table\" style=\"font-feature-settings:'tnum';white-space:nowrap;font-size:13.5px\">\n            <sc-raw-thead>\n              <sc-raw-tr>\n                <sc-raw-th style=\"position:sticky;top:0;background:var(--color-bg);z-index:2\">#<\u002Fsc-raw-th>\n                <sc-for list=\"{{ rawCols }}\" as=\"h\" hint-placeholder-count=\"8\">\n                  <sc-raw-th style=\"position:sticky;top:0;background:var(--color-bg);z-index:2\">\n                    <span style=\"font-family:var(--font-heading);font-size:14px;letter-spacing:0;text-transform:none\">{{ h.name }}<\u002Fspan>\n                    <span style=\"display:block;font-size:10px;letter-spacing:.08em;opacity:.65;font-weight:400\">{{ h.typeLabel }}<\u002Fspan>\n                  <\u002Fsc-raw-th>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ rawRows }}\" as=\"r\" hint-placeholder-count=\"14\">\n                <sc-raw-tr>\n                  <sc-raw-td style=\"color:color-mix(in srgb,var(--color-text) 35%,transparent);font-size:12px\">{{ r.n }}<\u002Fsc-raw-td>\n                  <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"8\">\n                    <sc-raw-td style=\"{{ c.style }}\">{{ c.v }}<\u002Fsc-raw-td>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isClean }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"display:flex;align-items:stretch;min-height:calc(100vh - 62px)\">\n\n      <aside style=\"width:276px;flex:none;border-right:1px solid var(--color-divider);padding:var(--space-4) 0;display:flex;flex-direction:column;gap:var(--space-2)\">\n        <div style=\"padding:0 var(--space-4);display:flex;align-items:baseline;justify-content:space-between\">\n          <h6 style=\"margin:0\">Columns<\u002Fh6>\n          <span style=\"font-size:12px;font-feature-settings:'tnum';color:color-mix(in srgb,var(--color-text) 50%,transparent)\">{{ nColsLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:0 var(--space-4);display:flex;gap:var(--space-3);font-size:11.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">\n          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,var(--sig-bad) 30%,transparent);border:1px solid var(--sig-bad)\"><\u002Fspan>needs a decision<\u002Fspan>\n          <span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:7px;height:7px;border-radius:50%;background:color-mix(in srgb,var(--sig-ok) 26%,transparent);border:1px solid var(--sig-ok)\"><\u002Fspan>clear<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column\">\n          <sc-for list=\"{{ colList }}\" as=\"c\" hint-placeholder-count=\"8\">\n            <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.style }}\" style-hover=\"background:color-mix(in srgb,var(--color-text) 5%,transparent)\">\n              <span style=\"display:flex;align-items:center;gap:7px;min-width:0\">\n                <span style=\"{{ c.dotStyle }}\"><\u002Fspan>\n                <span style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.name }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 48%,transparent);flex:none\">{{ c.typeLabel }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <hr class=\"hr\" style=\"margin:var(--space-3) var(--space-4)\">\n        <div style=\"padding:0 var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)\">\n          <h6 style=\"margin:0\">Table rules<\u002Fh6>\n          <label class=\"radio\" style=\"gap:9px;align-items:flex-start\">\n            <input type=\"checkbox\" checked=\"{{ dropDupes }}\" sc-camel-on-change=\"{{ toggleDupes }}\">\n            <span class=\"dot\" style=\"border-radius:2px;margin-top:2px\"><\u002Fspan>\n            <span style=\"font-size:13px\">Remove fully duplicated rows<\u002Fspan>\n          <\u002Flabel>\n          <div class=\"field\">\n            <label>Mostly-invalid rows<\u002Flabel>\n            <sc-raw-select class=\"input\" data-val=\"{{ badRows }}\" value=\"{{ badRows }}\" sc-camel-on-change=\"{{ setBadRows }}\" style=\"min-height:30px;font-size:13px\">\n              <option value=\"keep\">Keep them as they are<\u002Foption>\n              <option value=\"blank\">Blank every value in them<\u002Foption>\n              <option value=\"drop\">Remove the rows<\u002Foption>\n            <\u002Fsc-raw-select>\n            <div style=\"font-size:12px;margin-top:4px;color:color-mix(in srgb,var(--color-text) 58%,transparent)\">{{ badRowNote }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Time column<\u002Flabel>\n            <sc-raw-select class=\"input\" data-val=\"{{ timeCol }}\" value=\"{{ timeCol }}\" sc-camel-on-change=\"{{ setTimeCol }}\" style=\"min-height:30px;font-size:13px\">\n              <option value=\"\">None<\u002Foption>\n              <sc-for list=\"{{ dateColOptions }}\" as=\"o\" hint-placeholder-count=\"0\">\n                <option value=\"{{ o.v }}\">{{ o.v }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <div style=\"font-size:12px;margin-top:4px;color:color-mix(in srgb,var(--color-text) 58%,transparent)\">{{ timeColNote }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;line-height:1.5;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ cleanNote }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Faside>\n\n      <main style=\"flex:1;min-width:0;padding:var(--space-4) var(--space-6) var(--space-8);display:flex;flex-direction:column;gap:var(--space-6)\">\n        <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap\">\n          <div>\n            <div class=\"card-kicker\" style=\"font-size: 15px\">{{ fileName }}<\u002Fdiv>\n            <h2 style=\"margin:0;font-weight:400\">{{ shapeLabel }}<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:var(--space-2);align-items:center\">\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ gotoDrop }}\" style=\"font-size:15px;padding:9px 18px\">New file<\u002Fbutton>\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ exportCsv }}\" style=\"font-size:15px;padding:9px 18px\">Export clean CSV<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ gotoAnalyze }}\" style=\"font-size:15px;padding:10px 22px;border:1px solid var(--color-accent);border-radius:var(--radius-sm);background:var(--color-accent);color:var(--color-bg);font-family:var(--font-heading);cursor:pointer\" style-hover=\"background:var(--color-accent-600);border-color:var(--color-accent-600)\">Analyse →<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-3)\">\n            <h3 style=\"margin:0;font-weight:400;font-size:28px\">Flagged issues<\u002Fh3>\n            <div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fdiv>\n            <span style=\"font-size:12.5px;font-feature-settings:'tnum';color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ issueNote }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-md);max-height:290px;overflow:auto\">\n            <sc-for list=\"{{ issues }}\" as=\"i\" hint-placeholder-count=\"4\">\n              <div style=\"{{ i.rowStyle }}\">\n                <div style=\"min-width:0;flex:1\">\n                  <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                    <button sc-camel-on-click=\"{{ i.onSelect }}\" style=\"background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:15px;font-family:var(--font-heading);color:var(--color-accent)\">{{ i.col }}<\u002Fbutton>\n                    <span style=\"font-size:15px\">{{ i.label }}<\u002Fspan>\n                    <span class=\"tag tag-neutral\" style=\"font-feature-settings:'tnum'\">{{ i.countLabel }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px;margin-top:3px;color:color-mix(in srgb,var(--color-text) 58%,transparent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ i.detail }}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-if value=\"{{ i.open }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex;align-items:center;gap:var(--space-1);flex:none\">\n                    <sc-if value=\"{{ i.canText }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"display:flex;align-items:center;gap:6px;padding-right:var(--space-2);margin-right:2px;border-right:1px solid var(--color-divider)\">\n                        <input class=\"input\" placeholder=\"e.g. Not recorded\" value=\"{{ i.text }}\" sc-camel-on-change=\"{{ i.onText }}\" style=\"width:150px;min-height:30px;font-size:13px\">\n                        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ i.onFixText }}\" style=\"font-size:13px;padding:5px 11px\">Standardise to this<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ i.onFix }}\" style=\"font-size:13px;padding:5px 11px\">{{ i.fixLabel }}<\u002Fbutton>\n                    <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ i.onIgnore }}\" style=\"font-size:13px\">Leave<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ i.done }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"{{ i.doneStyle }}\">{{ i.doneLabel }}<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ noIssues }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:var(--space-4);font-size:13px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">Nothing outstanding — every flag has been answered.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-4)\">\n          <h3 style=\"margin:0;font-weight:400;font-size:28px\">Column rules<\u002Fh3>\n          <div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fdiv>\n          <span style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ rulesNote }}<\u002Fspan>\n          <sc-raw-select class=\"input\" data-val=\"\" value=\"\" sc-camel-on-change=\"{{ addRuleCol }}\" style=\"width:auto;min-height:34px;font-size:13.5px\">\n            <option value=\"\">Add a column to edit…<\u002Foption>\n            <sc-for list=\"{{ addableCols }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <option value=\"{{ o.v }}\">{{ o.v }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ noRuleCards }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border:1px dashed var(--color-divider);border-radius:var(--radius-md);padding:var(--space-6);text-align:center\">\n            <div style=\"font-family:var(--font-heading);font-size:20px\">Pick a column from the left to get started<\u002Fdiv>\n            <div style=\"font-size:14px;margin-top:4px;color:color-mix(in srgb,var(--color-text) 60%,transparent)\">Its datatype, casing, permitted values and date format all live here. Use “Add a column to edit” above to work on several at once.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ ruleCards }}\" as=\"k\" hint-placeholder-count=\"1\">\n          <div style=\"border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-4)\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap\">\n              <div style=\"display:flex;align-items:flex-start;gap:10px\">\n                <span style=\"{{ k.dotStyle }}\"><\u002Fspan>\n                <div>\n                  <h3 style=\"margin:0;font-weight:400;font-size:26px\">{{ k.name }}<\u002Fh3>\n                  <div style=\"font-size:13px;color:color-mix(in srgb,var(--color-text) 62%,transparent);font-feature-settings:'tnum'\">{{ k.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:var(--space-4)\">\n                <label class=\"radio\" style=\"gap:8px\">\n                  <input type=\"checkbox\" checked=\"{{ k.cfDrop }}\" sc-camel-on-change=\"{{ k.toggleDrop }}\">\n                  <span class=\"dot\" style=\"border-radius:2px\"><\u002Fspan>\n                  <span style=\"font-size:13.5px\">Exclude this column<\u002Fspan>\n                <\u002Flabel>\n                <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ k.onClose }}\" style=\"font-size:13px;padding:4px 10px\">Close<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--space-3)\">\n              <div class=\"field\">\n                <label>Datatype<\u002Flabel>\n                <sc-raw-select class=\"input\" data-val=\"{{ k.cfType }}\" value=\"{{ k.cfType }}\" sc-camel-on-change=\"{{ k.setType }}\">\n                  <option value=\"string\">Text<\u002Foption>\n                  <option value=\"category\">Category<\u002Foption>\n                  <option value=\"integer\">Integer<\u002Foption>\n                  <option value=\"decimal\">Decimal<\u002Foption>\n                  <option value=\"boolean\">Boolean<\u002Foption>\n                  <option value=\"date\">Date / time<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div class=\"field\">\n                <label>Count as missing<\u002Flabel>\n                <sc-raw-select class=\"input\" data-val=\"{{ k.cfNulls }}\" value=\"{{ k.cfNulls }}\" sc-camel-on-change=\"{{ k.setNulls }}\">\n                  <option value=\"\">Only truly empty cells<\u002Foption>\n                  <option value=\"auto\">{{ k.autoNullLabel }}<\u002Foption>\n                  <option value=\"common\">Empty cells + any common placeholder (NA, null, none, –, ?)<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <sc-if value=\"{{ k.isTexty }}\" hint-placeholder-val=\"{{ true }}\">\n                <div class=\"field\">\n                  <label>Letter case<\u002Flabel>\n                  <sc-raw-select class=\"input\" data-val=\"{{ k.cfCase }}\" value=\"{{ k.cfCase }}\" sc-camel-on-change=\"{{ k.setCase }}\">\n                    <option value=\"none\">As written<\u002Foption>\n                    <option value=\"lower\">lowercase<\u002Foption>\n                    <option value=\"upper\">UPPERCASE<\u002Foption>\n                    <option value=\"title\">Title Case<\u002Foption>\n                    <option value=\"sentence\">Sentence case<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ k.isTexty }}\" hint-placeholder-val=\"{{ true }}\">\n                <div class=\"field\">\n                  <label>Special characters<\u002Flabel>\n                  <sc-raw-select class=\"input\" data-val=\"{{ k.cfSpecial }}\" value=\"{{ k.cfSpecial }}\" sc-camel-on-change=\"{{ k.setSpecial }}\">\n                    <option value=\"keep\">Keep everything<\u002Foption>\n                    <option value=\"deaccent\">Fold accents (é → e)<\u002Foption>\n                    <option value=\"strip\">Remove non-ASCII<\u002Foption>\n                    <option value=\"replace\">Replace non-ASCII with ?<\u002Foption>\n                    <option value=\"alnum\">Letters, digits and spaces only<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ k.isNumy }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"field\">\n                  <label>Fill missing with<\u002Flabel>\n                  <sc-raw-select class=\"input\" data-val=\"{{ k.cfFill }}\" value=\"{{ k.cfFill }}\" sc-camel-on-change=\"{{ k.setFill }}\">\n                    <option value=\"none\">Leave blank<\u002Foption>\n                    <option value=\"zero\">Zero<\u002Foption>\n                    <option value=\"mean\">Column mean<\u002Foption>\n                    <option value=\"median\">Column median<\u002Foption>\n                    <option value=\"text\">A value I type…<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ k.isTexty }}\" hint-placeholder-val=\"{{ true }}\">\n                <div class=\"field\">\n                  <label>Fill missing with<\u002Flabel>\n                  <sc-raw-select class=\"input\" data-val=\"{{ k.cfFill }}\" value=\"{{ k.cfFill }}\" sc-camel-on-change=\"{{ k.setFill }}\">\n                    <option value=\"none\">Leave blank<\u002Foption>\n                    <option value=\"text\">A value I type…<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ k.showFillText }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"field\">\n                  <label>{{ k.fillTextLabel }}<\u002Flabel>\n                  <input class=\"input\" placeholder=\"Not recorded\" value=\"{{ k.cfFillText }}\" sc-camel-on-change=\"{{ k.setFillText }}\">\n                  <sc-if value=\"{{ k.fillBad }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:12.5px;color:var(--sig-bad)\">\n                      <span>{{ k.fillBadNote }}<\u002Fspan>\n                      <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ k.onRetype }}\" style=\"font-size:12.5px;padding:2px 8px\">Switch to Text<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ k.isDatey }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"field\">\n                  <label>Read dates as<\u002Flabel>\n                  <sc-raw-select class=\"input\" data-val=\"{{ k.cfDateIn }}\" value=\"{{ k.cfDateIn }}\" sc-camel-on-change=\"{{ k.setDateIn }}\">\n                    <option value=\"auto\">Detect automatically<\u002Foption>\n                    <option value=\"YMD\">Y-M-D<\u002Foption>\n                    <option value=\"MDY\">M/D/Y<\u002Foption>\n                    <option value=\"DMY\">D/M/Y<\u002Foption>\n                    <option value=\"epoch\">Unix timestamp<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ k.isDatey }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"field\">\n                  <label>Write dates as<\u002Flabel>\n                  <sc-raw-select class=\"input\" data-val=\"{{ k.cfDateOut }}\" value=\"{{ k.cfDateOut }}\" sc-camel-on-change=\"{{ k.setDateOut }}\">\n                    <option value=\"iso\">2024-03-12<\u002Foption>\n                    <option value=\"isoT\">2024-03-12 14:05<\u002Foption>\n                    <option value=\"us\">03/12/2024<\u002Foption>\n                    <option value=\"eu\">12/03/2024<\u002Foption>\n                    <option value=\"long\">12 Mar 2024<\u002Foption>\n                    <option value=\"ym\">2024-03<\u002Foption>\n                    <option value=\"time\">13:41<\u002Foption>\n                    <option value=\"timeM\">13:41.4<\u002Foption>\n                    <option value=\"timeS\">13:41:24<\u002Foption>\n                    <option value=\"timeMs\">13:41:24.4<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ k.isTexty }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;gap:var(--space-6);flex-wrap:wrap\">\n                <label class=\"radio\" style=\"gap:8px\">\n                  <input type=\"checkbox\" checked=\"{{ k.cfTrim }}\" sc-camel-on-change=\"{{ k.toggleTrim }}\">\n                  <span class=\"dot\" style=\"border-radius:2px\"><\u002Fspan>\n                  <span style=\"font-size:13.5px\">Trim leading and trailing space<\u002Fspan>\n                <\u002Flabel>\n                <label class=\"radio\" style=\"gap:8px\">\n                  <input type=\"checkbox\" checked=\"{{ k.cfCollapse }}\" sc-camel-on-change=\"{{ k.toggleCollapse }}\">\n                  <span class=\"dot\" style=\"border-radius:2px\"><\u002Fspan>\n                  <span style=\"font-size:13.5px\">Collapse runs of whitespace<\u002Fspan>\n                <\u002Flabel>\n                <label class=\"radio\" style=\"gap:8px\">\n                  <input type=\"checkbox\" checked=\"{{ k.cfKeyDedupe }}\" sc-camel-on-change=\"{{ k.toggleKeyDedupe }}\">\n                  <span class=\"dot\" style=\"border-radius:2px\"><\u002Fspan>\n                  <span style=\"font-size:13.5px\">Keep first row per value (key)<\u002Fspan>\n                <\u002Flabel>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <hr class=\"hr\" style=\"margin:0\">\n\n            <div style=\"display:flex;flex-direction:column;gap:var(--space-2)\">\n              <div style=\"display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap\">\n                <h6 style=\"margin:0\">Permitted values<\u002Fh6>\n                <div class=\"seg\">\n                  <label class=\"seg-opt\"><input type=\"radio\" name=\"{{ k.radioName }}\" value=\"off\" checked=\"{{ k.listOff }}\" sc-camel-on-change=\"{{ k.setListOff }}\"><span>Off<\u002Fspan><\u002Flabel>\n                  <label class=\"seg-opt\"><input type=\"radio\" name=\"{{ k.radioName }}\" value=\"allow\" checked=\"{{ k.listAllow }}\" sc-camel-on-change=\"{{ k.setListAllow }}\"><span>Allow-list<\u002Fspan><\u002Flabel>\n                  <label class=\"seg-opt\"><input type=\"radio\" name=\"{{ k.radioName }}\" value=\"deny\" checked=\"{{ k.listDeny }}\" sc-camel-on-change=\"{{ k.setListDeny }}\"><span>Deny-list<\u002Fspan><\u002Flabel>\n                <\u002Fdiv>\n                <sc-if value=\"{{ k.listOn }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;align-items:center;gap:var(--space-2)\">\n                    <span style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 58%,transparent)\">Offending value →<\u002Fspan>\n                    <sc-raw-select class=\"input\" data-val=\"{{ k.cfViolation }}\" value=\"{{ k.cfViolation }}\" sc-camel-on-change=\"{{ k.setViolation }}\" style=\"width:auto;min-height:30px;font-size:13px\">\n                      <option value=\"null\">blank it<\u002Foption>\n                      <option value=\"drop\">drop the row<\u002Foption>\n                    <\u002Fsc-raw-select>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <input class=\"input\" placeholder=\"Search values\" value=\"{{ k.valSearch }}\" sc-camel-on-change=\"{{ k.setValSearch }}\" style=\"width:auto;min-height:30px;font-size:13px;margin-left:auto\">\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 62%,transparent)\">{{ k.chipsNote }}<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow:auto;padding:2px\">\n                <sc-for list=\"{{ k.valueChips }}\" as=\"v\" hint-placeholder-count=\"10\">\n                  <button sc-camel-on-click=\"{{ v.onClick }}\" style=\"{{ v.style }}\">\n                    <span style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:24ch\">{{ v.v }}<\u002Fspan>\n                    <span style=\"font-feature-settings:'tnum';opacity:.6;font-size:10px\">{{ v.count }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div style=\"display:flex;flex-direction:column;min-height:0;margin-top:var(--space-4)\">\n          <div style=\"display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-3)\">\n            <h3 style=\"margin:0;font-weight:400;font-size:28px\">Cleaned preview<\u002Fh3>\n            <div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fdiv>\n            <span style=\"font-size:12.5px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">{{ previewNote }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"overflow:auto;max-height:440px;border:1px solid var(--color-divider);border-radius:var(--radius-md)\">\n            <sc-raw-table class=\"table\" style=\"font-feature-settings:'tnum';white-space:nowrap\">\n              <sc-raw-thead>\n                <sc-raw-tr>\n                  <sc-raw-th style=\"position:sticky;top:0;background:var(--color-bg);z-index:2\">#<\u002Fsc-raw-th>\n                  <sc-for list=\"{{ previewCols }}\" as=\"h\" hint-placeholder-count=\"8\">\n                    <sc-raw-th style=\"position:sticky;top:0;background:var(--color-bg);z-index:2;cursor:pointer\" sc-camel-on-click=\"{{ h.onClick }}\">\n                      <span style=\"{{ h.nameStyle }}\">{{ h.name }}<\u002Fspan>\n                      <span style=\"display:block;font-size:9px;letter-spacing:.08em;opacity:.7;font-weight:400\">{{ h.typeLabel }}<\u002Fspan>\n                    <\u002Fsc-raw-th>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ previewRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n                  <sc-raw-tr>\n                    <sc-raw-td style=\"color:color-mix(in srgb,var(--color-text) 35%,transparent);font-size:12px\">{{ r.n }}<\u002Fsc-raw-td>\n                    <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"8\">\n                      <sc-raw-td style=\"{{ c.style }}\" title=\"{{ c.title }}\">{{ c.v }}<\u002Fsc-raw-td>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fmain>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAnalyze }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"padding:0 0 var(--space-8)\">\n      <div style=\"position:sticky;top:62px;z-index:15;background:var(--color-bg);border-bottom:1px solid var(--color-divider);padding:var(--space-3) var(--space-6);display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap\">\n        <div style=\"display:flex;align-items:baseline;gap:var(--space-2)\">\n          <span style=\"font-family:var(--font-heading);font-size:19px;font-feature-settings:'tnum'\">{{ filterCount }}<\u002Fspan>\n          <span style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 55%,transparent)\">rows in view<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:1px;height:20px;background:var(--color-divider)\"><\u002Fdiv>\n        <div style=\"display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0\">\n          <sc-for list=\"{{ chips }}\" as=\"f\" hint-placeholder-count=\"0\">\n            <button class=\"tag tag-outline\" sc-camel-on-click=\"{{ f.onRemove }}\" style=\"cursor:pointer;gap:7px;background:transparent;font-family:var(--font-body);font-feature-settings:'tnum'\">\n              <span>{{ f.label }}<\u002Fspan><span style=\"opacity:.7\">×<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noFilters }}\" hint-placeholder-val=\"{{ true }}\">\n            <span style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 45%,transparent)\">No filters — click a bar, a category or drag across the scatter to filter every plot at once.<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ clearFilters }}\" style=\"font-size:13px\">Clear<\u002Fbutton>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ gotoClean }}\" style=\"font-size:13px\">← Schema<\u002Fbutton>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ exportFiltered }}\" style=\"font-size:13px\">Export view<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"max-width:1240px;margin:0 auto;padding:var(--space-6) var(--space-6) 0;display:flex;flex-direction:column;gap:var(--space-8)\">\n\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-2)\">\n            <h3 style=\"margin:0;font-weight:400;font-size:32px\">Summary statistics<\u002Fh3>\n            <div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0 0 var(--space-3);font-size:15px;max-width:82ch;color:color-mix(in srgb,var(--color-text) 74%,transparent)\">{{ statBlurb }}<\u002Fp>\n          <div style=\"overflow:auto\">\n            <sc-raw-table class=\"table\" style=\"font-feature-settings:'tnum';white-space:nowrap\">\n              <sc-raw-thead>\n                <sc-raw-tr>\n                  <sc-raw-th>Column<\u002Fsc-raw-th><sc-raw-th>n<\u002Fsc-raw-th><sc-raw-th>missing<\u002Fsc-raw-th><sc-raw-th>mean<\u002Fsc-raw-th><sc-raw-th>median<\u002Fsc-raw-th><sc-raw-th>std dev<\u002Fsc-raw-th><sc-raw-th>min<\u002Fsc-raw-th><sc-raw-th>25%<\u002Fsc-raw-th><sc-raw-th>75%<\u002Fsc-raw-th><sc-raw-th>max<\u002Fsc-raw-th><sc-raw-th>outliers<\u002Fsc-raw-th>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ statRows }}\" as=\"s\" hint-placeholder-count=\"5\">\n                  <sc-raw-tr>\n                    <sc-raw-td style=\"font-family:var(--font-heading);font-size:17px\">{{ s.name }}<\u002Fsc-raw-td>\n                    <sc-raw-td>{{ s.n }}<\u002Fsc-raw-td><sc-raw-td>{{ s.missing }}<\u002Fsc-raw-td><sc-raw-td>{{ s.mean }}<\u002Fsc-raw-td><sc-raw-td>{{ s.median }}<\u002Fsc-raw-td><sc-raw-td>{{ s.sd }}<\u002Fsc-raw-td>\n                    <sc-raw-td>{{ s.min }}<\u002Fsc-raw-td><sc-raw-td>{{ s.q1 }}<\u002Fsc-raw-td><sc-raw-td>{{ s.q3 }}<\u002Fsc-raw-td><sc-raw-td>{{ s.max }}<\u002Fsc-raw-td>\n                    <sc-raw-td><span style=\"{{ s.outStyle }}\">{{ s.out }}<\u002Fspan><\u002Fsc-raw-td>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-2)\">\n            <h3 style=\"margin:0;font-weight:400;font-size:32px\">Distributions<\u002Fh3>\n            <div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fdiv>\n            <span style=\"font-size:12px;color:color-mix(in srgb,var(--color-text) 52%,transparent)\">Faint bars are the unfiltered table · click to filter<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:var(--space-4)\">\n            <sc-for list=\"{{ dists }}\" as=\"d\" hint-placeholder-count=\"4\">\n              <div style=\"{{ d.cardStyle }}\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)\">\n                  <div style=\"display:flex;align-items:center;gap:9px;min-width:0\">\n                    <span style=\"{{ d.swatch }}\"><\u002Fspan>\n                    <div style=\"font-family:var(--font-heading);font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ d.name }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ d.isNum }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:flex;align-items:center;gap:6px;flex:none\">\n                      <span style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:color-mix(in srgb,var(--color-text) 50%,transparent)\">bins<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ d.binsDown }}\" style=\"{{ d.binBtn }}\" title=\"Fewer, wider bins\">−<\u002Fbutton>\n                      <span style=\"font-size:13px;font-feature-settings:'tnum';min-width:20px;text-align:center\">{{ d.binCount }}<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ d.binsUp }}\" style=\"{{ d.binBtn }}\" title=\"More, narrower bins\">+<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;font-feature-settings:'tnum';color:color-mix(in srgb,var(--color-text) 62%,transparent);margin-top:2px\">{{ d.note }}<\u002Fdiv>\n                <sc-if value=\"{{ d.isNum }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div>\n                    <div style=\"display:flex;align-items:flex-end;gap:2px;height:118px;margin-top:var(--space-3)\" sc-camel-on-mouse-leave=\"{{ d.onLeave }}\">\n                      <sc-for list=\"{{ d.bars }}\" as=\"b\" hint-placeholder-count=\"14\">\n                        <div sc-camel-on-click=\"{{ b.onClick }}\" sc-camel-on-mouse-enter=\"{{ b.onEnter }}\" style=\"flex:1;position:relative;height:100%;cursor:pointer\">\n                          <div style=\"position:absolute;left:0;right:0;bottom:0;height:{{ b.basePct }}%;background:color-mix(in srgb,var(--color-text) 7%,transparent)\"><\u002Fdiv>\n                          <div style=\"position:absolute;left:0;right:0;bottom:0;height:{{ b.pct }}%;background:{{ b.fill }};border-top:2px solid {{ b.stroke }}\"><\u002Fdiv>\n                        <\u002Fdiv>\n lex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap\">\n            <h3 style=\"margin:0;font-weight:400;font-size:32px\">One column against another<\u002Fh3>\n            <div style=\"flex:1;height:1px;background:var(--color-divider)\"><\u002Fdiv>\n            <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ addChart }}\" style=\"font-size:14px\">+ Add another chart<\u002Fbutton>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:var(--space-8)\">\n            <sc-for list=\"{{ charts }}\" as=\"ch\" hint-placeholder-count=\"1\">\n              <div style=\"display:flex;flex-direction:column;gap:var(--space-3)\">\n                <div style=\"display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap\">\n                  <sc-raw-select class=\"input\" data-val=\"{{ ch.x }}\" value=\"{{ ch.x }}\" sc-camel-on-change=\"{{ ch.setX }}\" style=\"width:auto;min-height:34px;font-size:13.5px\">\n                    <sc-for list=\"{{ numOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n                      <option value=\"{{ o.v }}\">{{ o.v }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <span style=\"font-size:12px;opacity:.6\">vs<\u002Fspan>\n                  <sc-raw-select class=\"input\" data-val=\"{{ ch.y }}\" value=\"{{ ch.y }}\" sc-camel-on-change=\"{{ ch.setY }}\" style=\"width:auto;min-height:34px;font-size:13.5px\">\n                    <sc-for list=\"{{ numOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n                      <option value=\"{{ o.v }}\">{{ o.v }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <label class=\"radio\" style=\"gap:8px;margin-left:var(--space-2)\">\n                    <input type=\"checkbox\" checked=\"{{ ch.trend }}\" sc-camel-on-change=\"{{ ch.toggleTrend }}\">\n                    <span class=\"dot\" style=\" {\n        const f = this.fences(sr.st);\n        pts.forEach(r => {\n          const v = r[sr.c];\n          if (typeof v === 'number' && (v < f[0] || v > f[1])) olist.push({ c: sr.c, v: v, when: r[tCol], dev: Math.abs(v - sr.st.median) / (sr.st.sd || 1) });\n        });\n      });\n      olist.sort((a, b) => b.dev - a.dev);\n      out.tsNoOut = olist.length === 0;\n      out.tsOutBlurb = olist.length\n        ? olist.length.toLocaleString('en-US') + ' readings across the plotted series sit outside their fences. The furthest is ' +\n          this.fmt(olist[0].v, 2) + ' in “' + olist[0].c + '”.'\n        : 'Every plotted reading sits inside its fences.';\n      out.tsOutRows = olist.slice(0, 40).map(o => ({ label: o.c + ' — ' + this.shortWhen(o.when, span), value: this.fmt(o.v, 2) }));\n\n      const rising = series.filter(sr => sr.fit && sr.fit.r > .1).sort((a, b) => b.fit.r - a.fit.r);\n      const falling = series.filter(sr => sr.fit && sr.fit.r < -.1).sort((a, b) => a.fit.r - b.fit.r);\n      out.tsBlurb = series.length === 0\n        ? 'Tick one or more numeric columns at left to draw them against ' + tCol + '.'\n        : this.fmt(pts.length) + ' rows in view span ' + this.shortWhen(new Date(t0), span) + ' to ' + this.shortWhen(new Date(t1), span) + '. ' +\n          (rising.length ? rising[0].c + ' rises most over the window (r = ' + this.fmt(rising[0].fit.r, 2) + ')' + (falling.length ? ', while ' + falling[0].c + ' falls (r = ' + this.fmt(falling[0].fit.r, 2) + ').' : '.')\n            : falling.length ? falling[0].c + ' falls most over the window (r = ' + this.fmt(falling[0].fit.r, 2) + ').'\n            : 'None of the plotted series trends with time — they wander around their means.') +\n          (norm ? ' Each series is scaled to 0–1 so shapes can be compared.' : '');\n    } else {\n      out.tsSeries = []; out.tsGrid = []; out.tsTicks = []; out.tsList = []; out.tsFits = [];\n      out.tsHoverOn = false; out.tsHoverDots = []; out.tsTip = { when: '', ro
